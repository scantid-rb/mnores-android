name: Publish Android 0.1.4 release

on:
  push:
    branches:
      - 0.1.4

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download production APK from Expo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 5 --output ShipInventory-Android-0.1.4.apk "https://expo.dev/artifacts/eas/94Yy467opPsWmsRUaFeaa9l8jpRS6kqPjDhzglxYP9M.apk"
          test -s ShipInventory-Android-0.1.4.apk
          unzip -t ShipInventory-Android-0.1.4.apk >/dev/null
          ls -lh ShipInventory-Android-0.1.4.apk

      - name: Generate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ShipInventory-Android-0.1.4.apk > ShipInventory-Android-0.1.4.apk.sha256
          cat ShipInventory-Android-0.1.4.apk.sha256

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # ShipInventory Android 0.1.4
          
          Primera release de produccion de la aplicacion Android de ShipInventory basada en la rama estable main.
          
          ## Novedades principales
          - Aplicacion Android basada en Expo / React Native.
          - Funcionamiento offline-first con base de datos SQLite local.
          - Creacion, edicion y eliminacion de repuestos sin conexion.
          - Cola local de operaciones pendientes.
          - Sincronizacion automatica al recuperar conexion.
          - Sincronizacion manual desde la aplicacion.
          - Soporte de fotografias de repuestos desde camara o galeria.
          - Persistencia local del inventario para consulta offline.
          
          ## Sincronizacion en segundo plano
          Esta version incorpora sincronizacion Android mediante WorkManager. Las operaciones pendientes pueden enviarse automaticamente al servidor cuando vuelve a existir conexion, incluso aunque ShipInventory ya no este abierta en primer plano.
          
          Incluye:
          - restriccion de ejecucion hasta disponer de conexion;
          - reintentos con backoff;
          - prevencion de sincronizaciones concurrentes;
          - reanudacion tras cierre normal del proceso;
          - recuperacion tras reinicio del dispositivo;
          - gestion de operaciones y fotografias pendientes.
          
          Android no permite garantizar ejecucion automatica despues de que el usuario haga Forzar detencion de la aplicacion desde los ajustes del sistema.
          
          ## Seguridad y consistencia
          - Token de autenticacion almacenado en SecureStore.
          - Proteccion frente a mezcla de datos y colas entre distintos usuarios.
          - Validacion de identidad mediante /api/me antes de enviar cambios pendientes.
          - Cambio seguro de usuario incluso ante cierres inesperados.
          - Las respuestas 401/403 no eliminan operaciones pendientes.
          - Conservacion de operaciones ante fallos de red o timeouts.
          - Creaciones idempotentes mediante client_local_id.
          - Gestion de fotografias asociadas a repuestos creados offline.
          - Correccion de fotografias huerfanas cuando falla definitivamente la creacion del repuesto padre.
          
          ## Permisos y perfiles
          - Perfil editable para todos los usuarios.
          - Cambio de contrasena propio.
          - Jefe de Maquinas con acceso a gestion de mecanicos de su propio barco.
          - Jefe de Maquinas sin acceso a administracion de barcos.
          - Mecanicos sin acceso a Administracion.
          - Restriccion de acceso y modificacion segun rol y barco asignado.
          
          ## Interfaz
          - Navegacion adaptada a Android.
          - Barra de navegacion del sistema configurada en modo oculto/inmersivo.
          - Pantalla Acerca de con informacion del cliente, version y servidor.
          - Configuracion dinamica de servidor.
          - Indicadores de conectividad y estado de sincronizacion.
          
          ## Versiones
          - Android: 0.1.4
          - API requerida: 1.4.5
          - Expo SDK: 57
          - React Native: 0.86.3
          
          ## Instalacion
          Esta release distribuye un archivo APK de produccion.
          
          Servidor de produccion predeterminado:
          https://mnores.atwebpages.com
          
          ## Compatibilidad
          La aplicacion requiere un servidor ShipInventory compatible con API 1.4.5. Antes de iniciar sesion se valida la compatibilidad mediante el handshake de la API.
          
          ## Verificacion de integridad
          La release incluye un archivo .sha256 para verificar la integridad del APK descargado.
          
          Linux/macOS:
          sha256sum -c ShipInventory-Android-0.1.4.apk.sha256
          
          Windows PowerShell:
          Get-FileHash .\ShipInventory-Android-0.1.4.apk -Algorithm SHA256
          
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create android-v0.1.4 ShipInventory-Android-0.1.4.apk ShipInventory-Android-0.1.4.apk.sha256 --repo "${GITHUB_REPOSITORY}" --target main --title "ShipInventory Android 0.1.4" --notes-file RELEASE_NOTES.md --latest
