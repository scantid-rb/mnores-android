name: Refresh Android 0.1.4 release notes

on:
  push:
    branches:
      - 0.1.4

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # ShipInventory Android 0.1.4
          
          Primera release de producción de la aplicación Android de ShipInventory basada en la rama estable `main`.
          
          ## Novedades principales
          
          - Aplicación Android basada en Expo / React Native.
          - Funcionamiento **offline-first** con base de datos SQLite local.
          - Creación, edición y eliminación de repuestos sin conexión.
          - Cola local de operaciones pendientes.
          - Sincronización automática al recuperar conexión.
          - Sincronización manual desde la aplicación.
          - Soporte de fotografías de repuestos desde cámara o galería.
          - Persistencia local del inventario para consulta offline.
          
          ## Sincronización en segundo plano
          
          Esta versión incorpora sincronización Android mediante **WorkManager**. Las operaciones pendientes pueden enviarse automáticamente al servidor cuando vuelve a existir conexión, incluso aunque ShipInventory ya no esté abierta en primer plano.
          
          Incluye:
          
          - restricción de ejecución hasta disponer de conexión;
          - reintentos con backoff;
          - prevención de sincronizaciones concurrentes;
          - reanudación tras cierre normal del proceso;
          - recuperación tras reinicio del dispositivo;
          - gestión de operaciones y fotografías pendientes.
          
          > Android no permite garantizar ejecución automática después de que el usuario haga **Forzar detención** de la aplicación desde los ajustes del sistema. Es una limitación del sistema operativo.
          
          ## Seguridad y consistencia
          
          - Token de autenticación almacenado en **SecureStore**.
          - Protección frente a mezcla de datos y colas entre distintos usuarios.
          - Validación de identidad mediante `/api/me` antes de enviar cambios pendientes.
          - Cambio seguro de usuario incluso ante cierres inesperados.
          - Las respuestas `401/403` no eliminan operaciones pendientes.
          - Conservación de operaciones ante fallos de red o timeouts.
          - Creaciones idempotentes mediante `client_local_id`.
          - Gestión de fotografías asociadas a repuestos creados offline.
          - Corrección de fotografías huérfanas cuando falla definitivamente la creación del repuesto padre.
          
          ## Permisos y perfiles
          
          - Perfil editable para todos los usuarios.
          - Cambio de contraseña propio.
          - Jefe de Máquinas con acceso a gestión de mecánicos de su propio barco.
          - Jefe de Máquinas sin acceso a administración de barcos.
          - Mecánicos sin acceso a Administración.
          - Restricción de acceso y modificación según rol y barco asignado.
          
          ## Interfaz
          
          - Navegación adaptada a Android.
          - Barra de navegación del sistema configurada en modo oculto/inmersivo.
          - Pantalla **Acerca de** con información del cliente, versión y servidor.
          - Configuración dinámica de servidor.
          - Indicadores de conectividad y estado de sincronización.
          
          ## Versiones
          
          - Android: **0.1.4**
          - API requerida: **1.4.5**
          - Expo SDK: **57**
          - React Native: **0.86.3**
          
          ## Instalación
          
          Esta release distribuye un archivo **APK de producción**.
          
          Servidor de producción predeterminado:
          
          `https://mnores.atwebpages.com`
          
          ## Compatibilidad
          
          La aplicación requiere un servidor ShipInventory compatible con **API 1.4.5**. Antes de iniciar sesión se valida la compatibilidad mediante el handshake de la API.
          
          ## Verificación de integridad
          
          La release incluye `ShipInventory-Android-0.1.4.apk.sha256` para comprobar la integridad del APK descargado.
          
          SHA-256 del APK:
          
          `f6e2ff95f521164172dbb955ead490fa7bba1caab2362595d93af0dbc39e2f42`
          
          Linux/macOS:
          
          ```bash
          sha256sum -c ShipInventory-Android-0.1.4.apk.sha256
          ```
          
          Windows PowerShell:
          
          ```powershell
          Get-FileHash .\ShipInventory-Android-0.1.4.apk -Algorithm SHA256
          ```
          
          EOF

      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit android-v0.1.4 --repo "${GITHUB_REPOSITORY}" --title "ShipInventory Android 0.1.4" --notes-file RELEASE_NOTES.md --latest
